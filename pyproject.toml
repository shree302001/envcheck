[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "0.1.0"
description = "Check a .env file against .env.example: missing, extra, duplicate and empty variables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["dotenv", "env", "lint", "cli", "ci"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
envcheck = "envcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
